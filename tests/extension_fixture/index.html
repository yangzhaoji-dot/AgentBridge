<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgentBridge ChatGPT Adapter Fixture</title>
  </head>
  <body>
    <main>
      <div id="prompt-textarea" contenteditable="true" role="textbox"></div>
      <button data-testid="send-button" type="button">Send</button>
      <button id="run-adapter" type="button">Run adapter</button>
      <button id="run-stalled-adapter" type="button">Run stalled adapter</button>
      <button id="run-stop-gone-adapter" type="button">Run stop-gone adapter</button>
      <button id="run-marker-adapter" type="button">Run marker adapter</button>
      <section id="conversation"></section>
      <pre id="adapter-result"></pre>
    </main>
    <script>
      document.querySelector('[data-testid="send-button"]').addEventListener("click", () => {
        const conversation = document.querySelector("#conversation");
        const sendButton = document.querySelector('[data-testid="send-button"]');
        const answer = document.createElement("article");
        answer.dataset.messageAuthorRole = "assistant";
        conversation.append(answer);

        const stop = document.createElement("button");
        stop.dataset.testid = "stop-button";
        stop.textContent = "Stop";
        document.body.append(stop);

        if (document.querySelector("#prompt-textarea").innerText.trim() === "long response?") {
          answer.textContent = "FIRST";
          setTimeout(() => {
            answer.textContent += "_COMPLETE";
            stop.remove();
          }, 3500);
          return;
        }

        if (document.querySelector("#prompt-textarea").innerText.trim() === "stop gone?") {
          answer.textContent = "STOP_GONE_COMPLETE";
          setTimeout(() => {
            stop.remove();
            sendButton.removeAttribute("data-testid");
          }, 120);
          setTimeout(() => {
            sendButton.dataset.testid = "send-button";
          }, 5000);
          return;
        }

        const markerMatch = document.querySelector("#prompt-textarea").innerText.match(
          /exact marker ([A-Za-z0-9_.:-]+)/,
        );
        if (markerMatch) {
          answer.textContent = "MARKER_FIRST";
          setTimeout(() => {
            answer.textContent += `_COMPLETE_${markerMatch[1]}`;
            stop.remove();
          }, 3500);
          return;
        }

        const chunks = ["FIXTURE", "_", "OK"];
        let index = 0;
        const timer = setInterval(() => {
          answer.textContent += chunks[index++];
          if (index === chunks.length) {
            clearInterval(timer);
            stop.remove();
          }
        }, 120);
      });
    </script>
    <script src="../../extension/chatgpt_adapter.js"></script>
    <script>
      document.querySelector("#run-adapter").addEventListener("click", async () => {
        const result = document.querySelector("#adapter-result");
        try {
          result.textContent = await AgentBridgeChatGPT.ask("1+1?", 10000);
        } catch (error) {
          result.textContent = `ERROR: ${error.message}`;
        }
      });

      document.querySelector("#run-stalled-adapter").addEventListener("click", async () => {
        const result = document.querySelector("#adapter-result");
        const originalQuerySelector = document.querySelector.bind(document);
        document.querySelector = (selector) =>
          selector.includes("stop") ? null : originalQuerySelector(selector);
        try {
          result.textContent = await AgentBridgeChatGPT.ask("long response?", 30000);
        } catch (error) {
          result.textContent = `ERROR: ${error.message}`;
        } finally {
          document.querySelector = originalQuerySelector;
        }
      });

      document.querySelector("#run-stop-gone-adapter").addEventListener("click", async () => {
        const result = document.querySelector("#adapter-result");
        try {
          result.textContent = await AgentBridgeChatGPT.ask("stop gone?", 15000);
        } catch (error) {
          result.textContent = `ERROR: ${error.message}`;
        }
      });

      document.querySelector("#run-marker-adapter").addEventListener("click", async () => {
        const result = document.querySelector("#adapter-result");
        try {
          result.textContent = await AgentBridgeChatGPT.ask(
            "marker response?",
            30000,
            "AGENTBRIDGE_DONE_fixture",
          );
        } catch (error) {
          result.textContent = `ERROR: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
